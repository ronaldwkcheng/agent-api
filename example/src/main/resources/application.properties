spring.application.name=agent-api

# Run as a plain application with no web server. This has to be explicit: Spring AI pulls in
# spring-webflux transitively for its HTTP clients, so deduceFromClasspath() finds WebFlux's
# DispatcherHandler, finds no WebMVC DispatcherServlet, and infers REACTIVE. Nothing brings in a
# reactive server, so startup then dies on a missing ReactiveWebServerFactory.
spring.main.web-application-type=none

spring.ai.openai.api-key=${openai_api_key}
spring.ai.openai.chat.options.model=gpt-4o

#logging.level.com.ronald.agent=DEBUG

# Enable virtual threads (for JDK 21+, Spring Boot 3.2+)
# With virtual threads enabled, CompletableFuture.supplyAsync becomes extremely lightweight,
# allowing to scale to hundreds of parallel tasks without exhausting the server's thread pool.
spring.threads.virtual.enabled=true
