spring.application.name=agent-api

# Run as a plain application with no web server. This has to be explicit: Spring AI pulls in
# spring-webflux transitively for its HTTP clients, so deduceFromClasspath() finds WebFlux's
# DispatcherHandler, finds no WebMVC DispatcherServlet, and infers REACTIVE. Nothing brings in a
# reactive server, so startup then dies on a missing ReactiveWebServerFactory.
spring.main.web-application-type=none

spring.ai.openai.api-key=${openai_api_key}
spring.ai.openai.chat.options.model=gpt-4o

#logging.level.com.ronald.agent=DEBUG

# Enable virtual threads (for JDK 21+, Spring Boot 3.2+)
# With virtual threads enabled, CompletableFuture.supplyAsync becomes extremely lightweight,
# allowing to scale to hundreds of parallel tasks without exhausting the server's thread pool.
spring.threads.virtual.enabled=true

# ── MCP tool servers ────────────────────────────────────────────────────────────
# Disabled by default, for the same reason no demo runner is registered by default: enabling the
# client makes it connect to every server configured below at context startup — a stdio server is
# spawned as a child process, an HTTP one gets a live connection — which would make `./gradlew
# build` depend on npx, the network, and whatever those servers reach.
#
# Turn it on for a single run:
#   ./gradlew bootRun --args='--agent.demo=react --spring.ai.mcp.client.enabled=true'
spring.ai.mcp.client.enabled=false

spring.ai.mcp.client.name=agent-api
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s

# Contributes a single ToolCallbackProvider bean covering the tools of every server below. That
# bean is what ReActWorkflow.Builder.toolCallbackProvider(...) takes.
spring.ai.mcp.client.toolcallback.enabled=true

# stdio — the server runs as a child process, talking over its stdin/stdout. On Windows the
# executable is npx.cmd; on Linux and macOS it is npx, so this line needs changing there.
spring.ai.mcp.client.stdio.connections.filesystem.command=npx.cmd
spring.ai.mcp.client.stdio.connections.filesystem.args[0]=-y
spring.ai.mcp.client.stdio.connections.filesystem.args[1]=@modelcontextprotocol/server-filesystem
# The directory the server is allowed to read. Scope it deliberately: every file under it becomes
# reachable by the model, and file contents land in the ReAct scratchpad. Under `bootRun` this
# resolves to the :example project directory, not the repository root — which is the
# `build.gradle.kts` the react demo asks about.
spring.ai.mcp.client.stdio.connections.filesystem.args[2]=${user.dir}

# streamable-HTTP — a locally hosted or remote server. Prefer this over SSE for anything new.
#spring.ai.mcp.client.streamable-http.connections.internal.url=http://localhost:8080
#spring.ai.mcp.client.streamable-http.connections.internal.endpoint=/mcp

# SSE — the older HTTP transport, for servers that speak only it.
#spring.ai.mcp.client.sse.connections.legacy.url=http://localhost:8081
#spring.ai.mcp.client.sse.connections.legacy.sse-endpoint=/sse

# ── RAG vector store (Chroma) ───────────────────────────────────────────────────
# `type` is load-bearing, for the same reason the MCP client is off above.
# ChromaVectorStoreAutoConfiguration carries
#   @ConditionalOnProperty(name = "spring.ai.vectorstore.type", havingValue = "chroma",
#                          matchIfMissing = true)
# so it is ON by default once the starter is on the classpath. Its ChromaVectorStore is an
# InitializingBean that connects to Chroma and creates its tenant, database and collection while
# the context starts — which would make a plain `./gradlew bootRun` and every @SpringBootTest
# depend on a Chroma running on localhost:8000. Any value other than `chroma` switches it off;
# `none` just says so readably.
#
# Turn it on for a single run, alongside the demo selector — the same two-flag shape the react
# demo uses for MCP:
#   docker compose up -d      # in E:\dev\spring_ai_workspace\chroma-doc
#   ./gradlew bootRun --args='--agent.demo=rag --spring.ai.vectorstore.type=chroma'
spring.ai.vectorstore.type=none

# These are Spring AI's own property names, and they are deliberately identical to the ones the
# companion ingestion project sets — one spelling, one collection, both projects agreeing on it.
# `client.host` carries the scheme; host and port are composed into the URL by the
# autoconfiguration.
#
# The tenant, database and collection are all created if missing (ChromaVectorStore does the
# get-or-create itself), so a fresh Chroma needs no manual setup. Nothing here populates the
# collection though: this app reads, and reports an empty collection rather than answering from
# nothing.
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.tenant-name=SpringAiTenant
spring.ai.vectorstore.chroma.database-name=SpringAiDatabase
spring.ai.vectorstore.chroma.collection-name=chroma-doc
spring.ai.vectorstore.chroma.initialize-schema=true

# ── RAG search bounds ───────────────────────────────────────────────────────────
# How the RagSubAgent bounds its search. A local namespace, not spring.ai.*: these are the
# agent's retrieval knobs and Spring AI has no property for either — spring.ai.vectorstore.chroma.*
# above covers only how to reach the store. Both are validated at startup, so a bad value here
# fails the boot rather than the first question.
#
# top-k is the main lever on token cost, not on retrieval cost: every passage retrieved is
# rendered into the prompt in full, so 4 medium passages and 20 are very different requests while
# the search itself barely moves.
agent.rag.top-k=4

# 0.0 accepts everything the store returns, which is deliberate as a default: a useful floor
# depends on the embedding model *and* the corpus, so a number that works in one deployment means
# nothing in another. Measure it against chroma-doc's contents before raising it — set it too high
# and questions the corpus does answer come back with the no-documents reply instead.
agent.rag.similarity-threshold=0.0

# Must match the model chroma-doc embedded the collection with. That app (see the RAG section of
# the README) sets `spring.ai.openai.embedding.model=text-embedding-3-small`, so this one has to
# query with the same model or the stored vectors and the query vector are not comparable.
#
# Note the different property path: chroma-doc runs Spring AI 2.0.x, where OpenAiEmbeddingProperties
# binds `model` directly; this module is on 1.1.2, where the only binding is through `options`.
# Writing it as `spring.ai.openai.embedding.model` here would bind to nothing and silently leave
# the default in place.
#
# Getting this wrong is the least obvious way to break a RAG pipeline: ada-002 (the default) and
# text-embedding-3-small both produce 1536-dimension vectors, so a mismatch raises no error
# anywhere. Chroma still returns the topK nearest neighbours, they are simply unrelated to the
# question. Only text-embedding-3-large (3072) fails loudly.
spring.ai.openai.embedding.options.model=text-embedding-3-small
