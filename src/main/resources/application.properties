spring.application.name=agent-api
server.port=8080

spring.ai.openai.api-key=${openai_api_key}
spring.ai.openai.chat.options.model=gpt-4o

#logging.level.com.ronald.agent=DEBUG

# Enable virtual threads (for JDK 21+, Spring Boot 3.2+)
# With virtual threads enabled, CompletableFuture.supplyAsync becomes extremely lightweight,
# allowing to scale to hundreds of parallel tasks without exhausting the server's thread pool.
spring.threads.virtual.enabled=true
